<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸鲸小镇 · 接入配置</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #12141a; --card: #1a1d25; --line: #2b2f3a; --text: #e6e8ee;
    --muted: #9aa1b1; --accent: #5b9dff; --ok: #47c07a; --warn: #e0a33c; --err: #e46464;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .field { margin-bottom: 14px; }
  .field:last-of-type { margin-bottom: 4px; }
  label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
  label .tag { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  input {
    width: 100%; padding: 8px 10px; background: #0f1116; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input:disabled { opacity: .55; }
  .hint { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
  .code-input { font-family: Consolas, monospace; letter-spacing: 3px; text-transform: uppercase; }
  button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: #232734; color: var(--text); font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  #status { margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; font-size: 13px; background: #202634; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }
  #status.err { color: var(--err); }
  code { font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>鲸鲸小镇</h1>
<p class="sub">这里只配置「这个 Bot 怎么连到小镇」。配对由插件用自己所在 Bot 的身份发起，不需要你填 Agent 编号。</p>

<div id="status">正在读取已保存的配置…</div>

<div class="card">
  <div class="field">
    <label for="service_url">小镇服务地址</label>
    <input id="service_url" type="text" spellcheck="false" autocomplete="off"
           placeholder="http://127.0.0.1:8800" disabled>
    <p class="hint">只接受 http/https，不得内嵌账号或口令。本页不会向这个地址发请求。</p>
  </div>

  <div class="field">
    <label for="pairing_code">接入码<span class="tag">一次性，10 分钟有效</span></label>
    <input id="pairing_code" class="code-input" type="text" spellcheck="false"
           autocomplete="off" maxlength="8" placeholder="ABCD2345" disabled>
    <p class="hint">
      在网页 <code>/admin</code> 填写账号与显示名，生成 8 位接入码，填到这里。
      插件启动后会用它兑换令牌，并把令牌存进运行数据目录（<code>&lt;dataDir&gt;/jingjing-town/role.json</code>），
      以后不需要再填。
    </p>
  </div>

  <div class="field">
    <label for="poll_interval_seconds">观察轮询间隔（秒）</label>
    <input id="poll_interval_seconds" type="number" min="5" max="300" step="1" disabled>
  </div>

  <div class="field">
    <label for="request_timeout_seconds">单次请求超时（秒）</label>
    <input id="request_timeout_seconds" type="number" min="2" max="30" step="1" disabled>
    <p class="hint">超时后工具回执为「结果未确认」，不会自动重试。</p>
  </div>

  <div class="field">
    <label for="stop_budget_seconds">停止等待预算（秒）</label>
    <input id="stop_budget_seconds" type="number" min="5" max="60" step="1" disabled>
    <p class="hint">停用插件时等待已接受工作结束的预算；到期未排空会报告未完成。</p>
  </div>

  <div class="actions">
    <button id="save" class="primary" type="button" disabled>保存</button>
    <button id="reload" type="button" disabled>重新读取</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var FIELDS = [
    'service_url',
    'pairing_code',
    'poll_interval_seconds',
    'request_timeout_seconds',
    'stop_budget_seconds'
  ];
  var NUMERIC = {
    poll_interval_seconds: [5, 300],
    request_timeout_seconds: [2, 30],
    stop_budget_seconds: [5, 60]
  };

  var revision = null;
  var snapshot = {};
  var dirty = false;
  var ready = false;
  var pendingSave = false;

  var statusEl = document.getElementById('status');
  var saveBtn = document.getElementById('save');
  var reloadBtn = document.getElementById('reload');

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function setEnabled(on) {
    FIELDS.forEach(function (name) {
      var el = document.getElementById(name);
      if (el) { el.disabled = !on; }
    });
    saveBtn.disabled = !on;
    reloadBtn.disabled = !on;
  }

  function post(payload) {
    parent.postMessage(payload, '*');
  }

  function requestConfig() {
    post({ type: 'telyincore:config:get' });
  }

  function applyState(config) {
    revision = config && config.revision != null ? config.revision : revision;
    var fields = (config && config.fields) || [];
    var values = {};
    fields.forEach(function (field) {
      if (field && Array.isArray(field.path)) {
        values[field.path.join('.')] = field.value;
      }
    });

    if (dirty) {
      setStatus('已保存的配置在别处被更新；为免覆盖你正在编辑的内容，本页未重新填充。点「重新读取」丢弃草稿并刷新。', 'warn');
      ready = true;
      setEnabled(true);
      saveBtn.disabled = true;
      return;
    }

    snapshot = {};
    FIELDS.forEach(function (name) {
      var value = values[name];
      if (value === undefined || value === null) { value = ''; }
      snapshot[name] = String(value);
      var el = document.getElementById(name);
      if (el) { el.value = snapshot[name]; }
    });
    ready = true;
    setEnabled(true);
    saveBtn.disabled = true;
    setStatus('已读取当前配置。', 'ok');
  }

  function collectChanges() {
    var changes = [];
    FIELDS.forEach(function (name) {
      var el = document.getElementById(name);
      if (!el) { return; }
      var value = (el.value || '').trim();
      if (name === 'pairing_code') { value = value.toUpperCase(); }
      if (value === snapshot[name]) { return; }
      if (NUMERIC[name]) {
        var number = Number(value);
        var low = NUMERIC[name][0];
        var high = NUMERIC[name][1];
        if (!isFinite(number) || Math.floor(number) !== number || number < low || number > high) {
          throw new Error(name + ' 必须是 ' + low + ' 到 ' + high + ' 之间的整数');
        }
        changes.push({ path: [name], value: number });
      } else {
        changes.push({ path: [name], value: value });
      }
    });
    return changes;
  }

  function onSave() {
    if (!ready || pendingSave) { return; }
    var changes;
    try {
      changes = collectChanges();
    } catch (err) {
      setStatus('未保存：' + err.message, 'err');
      return;
    }
    if (!changes.length) {
      setStatus('没有需要保存的改动。', 'ok');
      return;
    }
    pendingSave = true;
    saveBtn.disabled = true;
    setStatus('正在保存…');
    post({ type: 'telyincore:config:save', revision: revision, changes: changes });
  }

  window.addEventListener('message', function (event) {
    if (event.source !== parent) { return; }
    var data = event.data;
    if (!data || typeof data !== 'object') { return; }

    if (data.type === 'telyincore:config:state') {
      applyState(data.config || {});
      return;
    }
    if (data.type === 'telyincore:config:saved') {
      pendingSave = false;
      if (data.ok) {
        dirty = false;
        setStatus('已保存，正在重新读取…', 'ok');
        requestConfig();
      } else {
        setEnabled(true);
        saveBtn.disabled = false;
        setStatus('保存失败：' + (data.error || '宿主未返回原因，未写入任何值'), 'err');
      }
    }
  });

  FIELDS.forEach(function (name) {
    var el = document.getElementById(name);
    if (!el) { return; }
    el.addEventListener('input', function () {
      dirty = true;
      saveBtn.disabled = false;
      setStatus('有未保存的改动。');
    });
  });

  saveBtn.addEventListener('click', onSave);
  reloadBtn.addEventListener('click', function () {
    dirty = false;
    saveBtn.disabled = true;
    setStatus('正在重新读取…');
    requestConfig();
  });

  setTimeout(function () {
    if (!ready) {
      setStatus('未收到宿主的配置回执。请从 TelyinCore 的插件配置入口打开本页。', 'err');
    }
  }, 5000);

  if (window.parent === window) {
    setStatus('本页需要作为插件配置页嵌入宿主使用。', 'err');
  } else {
    requestConfig();
  }
})();
</script>
</body>
</html>
